<!doctype html>
<!-- OpenGraph image design, rendered by scripts/og-images.ts at 2x
     (2400x1260) and downscaled to 1200x630. Assets are injected as data
     URIs so the page is self-contained and loads in Electron with no
     file:// or CORS quirks. Two variants, selected by ?variant= :
     "icon" — the app icon over the wordmark; "shot" — the app screenshot. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dóru OpenGraph image</title>
  <style>
    @font-face {
      font-family: 'Berkshire Swash';
      font-style: normal;
      font-weight: 400;
      src: url(data:font/woff2;base64,__FONT_B64__) format('woff2');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 2400px; height: 1260px; overflow: hidden; }
    body {
      /* Mirrors the site hero: canvas -> chrome gradient with the sage
         accent glow behind (style.css hero + :root surfaces). */
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu,
        Cantarell, 'Helvetica Neue', sans-serif;
      color: #1f2621;
      background:
        radial-gradient(60% 60% at 50% 40%, rgba(63, 115, 85, 0.16) 0%, transparent 100%),
        linear-gradient(180deg, #fdfcf9 0%, #f2efe7 100%);
    }
    .wordmark {
      font-family: 'Berkshire Swash', Georgia, serif;
      font-weight: 400;
      letter-spacing: 0;
      color: #3f7355; /* --vp-c-brand-1 */
    }
    /* ── icon variant ── */
    .v-icon { display: none; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
    .v-icon .app-icon {
      width: 340px; height: 340px;
      filter: drop-shadow(0 20px 50px rgba(31, 38, 33, 0.2));
    }
    .v-icon .wordmark { font-size: 220px; line-height: 1.3; margin-top: 60px; }
    .v-icon .tagline { margin-top: 44px; font-size: 46px; color: #5d655f; }
    /* ── screenshot variant ── */
    .v-shot { display: none; height: 100%; flex-direction: column; }
    .v-shot header { display: flex; align-items: center; padding: 90px 140px 0; }
    .v-shot header .app-icon { width: 130px; height: 130px; }
    .v-shot header .wordmark { font-size: 140px; line-height: 1.3; margin-left: 40px; }
    .v-shot .frame {
      flex: 1; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 50px 140px 100px;
    }
    .v-shot .frame img {
      max-width: 100%; max-height: 100%;
      border: 2px solid rgba(0, 0, 0, 0.09);
      border-radius: 24px; /* 12px at 1x — the site's screenshot card */
      box-shadow: 0 24px 80px rgba(31, 38, 33, 0.22);
    }
    body[data-variant='icon'] .v-icon { display: flex; }
    body[data-variant='shot'] .v-shot { display: flex; }
  </style>
</head>
<body data-variant="">
  <div class="v-icon">
    <img class="app-icon" src="data:image/png;base64,__ICON_B64__" alt="">
    <h1 class="wordmark">Dóru</h1>
    <p class="tagline">Local-first genealogy for the AI era</p>
  </div>
  <div class="v-shot">
    <header>
      <img class="app-icon" src="data:image/png;base64,__ICON_B64__" alt="">
      <h1 class="wordmark">Dóru</h1>
    </header>
    <div class="frame">
      <img src="data:image/png;base64,__SHOT_B64__" alt="">
    </div>
  </div>
  <script>
    document.body.dataset.variant =
      new URLSearchParams(location.search).get('variant') === 'shot' ? 'shot' : 'icon';
  </script>
</body>
</html>
