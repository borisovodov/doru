appId: dev.doru.app
productName: Doru
executableName: doru
directories:
  output: release
files:
  - out/**
fileAssociations:
  - ext: doru
    name: Doru Tree
    role: Editor
mac:
  category: public.app-category.lifestyle
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  category: Education
  artifactName: doru-${version}-${arch}.${ext}
  target:
    - AppImage
    - deb
