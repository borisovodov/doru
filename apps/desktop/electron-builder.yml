appId: dev.doru.app
productName: Doru
executableName: doru
directories:
  output: release
files:
  - out/**
fileAssociations:
  - ext: doru
    name: Doru Tree
    role: Editor
mac:
  category: public.app-category.lifestyle
  artifactName: doru-mac-${arch}.${ext}
  target:
    - dmg
    - zip
win:
  artifactName: doru-windows-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
        - arm64
linux:
  category: Education
  artifactName: doru-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
