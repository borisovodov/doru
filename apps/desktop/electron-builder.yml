appId: org.doru.doru
# Display name for the packaged artifacts (menus, macOS display name). The
# filesystem identity — the userData directory — comes from package.json's
# productName, which stays ASCII ('Doru'); keep the accent out of paths.
productName: Dóru
executableName: doru
# Static AppImage runtime (AppImageKit toolset): the legacy fuse2 runtime is
# dynamically linked against an unversioned libz.so that stock systems do not
# ship, so AppImages failed to start on Ubuntu 24.04+.
toolsets:
  appimage: '1.0.3'
directories:
  output: release
files:
  - out/**
extraResources:
  - from: ../../themes
    to: themes
  - from: resources/icon.png
    to: icon.png
fileAssociations:
  - ext: doru
    name: Dóru Tree
    role: Editor
  - ext: ged
    name: GEDCOM file
    role: Viewer
  - ext: gdz
    name: GEDZIP archive
    role: Viewer
mac:
  category: public.app-category.lifestyle
  icon: build/Icon.icon
  artifactName: doru-mac-${arch}.${ext}
  # Capitalized bundle name (Doru.app) on macOS; the lowercase global
  # executableName stays for Windows and Linux, where it is conventional.
  executableName: Doru
  target:
    - dmg
dmg:
  icon: build/icon.icns
  # Stores and package managers update the app; no self-update artifacts.
  writeUpdateInfo: false
# Mac App Store builds are signed with the Apple Distribution certificate and
# run under the App Sandbox. The entitlements grant outbound network (agent
# chat, remote MCP), user-selected file access (.doru open/save dialogs) and
# app-scope bookmarks (recents). Build explicitly with `electron-builder
# --mac mas`; the default dmg target is unaffected.
mas:
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
win:
  icon: resources/icon.png
  artifactName: doru-windows-${arch}.${ext}
  target:
    # The plain zip is the Scoop artifact: package managers extract the
    # portable app directory instead of running an installer.
    - target: zip
      arch:
        - x64
        - arm64
linux:
  category: Education
  syncDesktopName: true
  # A sized set (16–512): the flatpak target skips single icons larger than
  # 512px, and without any icon the AppStream compose step fails.
  icon: resources/icons
  artifactName: doru-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
# The flatpak build (run by the borisovodov/flatpak bot) ships the AppStream
# metainfo so software centers and `flatpak remote-ls` show the app's name,
# version, and screenshots. The metainfo file is stamped with the release
# version at build time; the copy in distribution/metadata stays release-free.
flatpak:
  baseVersion: '26.08'
  runtimeVersion: '25.08'
  branch: stable
  files:
    - - ../../distribution/metadata/org.doru.doru.metainfo.xml
      - share/metainfo/org.doru.doru.metainfo.xml
