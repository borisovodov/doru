appId: dev.doru.app
productName: Doru
executableName: doru
directories:
  output: release
files:
  - out/**
extraResources:
  - from: ../../themes
    to: themes
  - from: resources/icon.png
    to: icon.png
fileAssociations:
  - ext: doru
    name: Dóru Tree
    role: Editor
mac:
  category: public.app-category.lifestyle
  icon: resources/icon.png
  artifactName: doru-mac-${arch}.${ext}
  target:
    - dmg
    - zip
win:
  icon: resources/icon.png
  artifactName: doru-windows-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
        - arm64
linux:
  category: Education
  icon: resources/icon.png
  artifactName: doru-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
