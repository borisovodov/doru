appId: dev.doru.app
productName: Doru
executableName: doru
directories:
  output: release
files:
  - out/**
fileAssociations:
  - ext: doru
    name: Doru Tree
    role: Editor
mac:
  category: public.app-category.lifestyle
  artifactName: doru-${arch}.${ext}
  target:
    - dmg
win:
  artifactName: doru-setup-${arch}.${ext}
  target:
    - nsis
nsis:
  differentialPackage: false
linux:
  category: Education
  artifactName: doru-${arch}.${ext}
  target:
    - AppImage
    - deb
