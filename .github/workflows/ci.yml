name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libasound2t64 libgbm1 xvfb
      - run: npm ci
      - run: npm test
      - name: Coverage gate
        if: runner.os == 'Linux'
        run: npm run test:coverage
      - name: Upload coverage to Coveralls
        # Run even when the coverage gate fails, so a pull request that drops
        # below the threshold still gets a Coveralls report. The step is
        # advisory: reporter failures exit 0, and the Coveralls status check is
        # kept advisory by clearing "Coverage Decrease Threshold for Failure"
        # in the Coveralls repository settings. Tag builds are skipped: the
        # commit was already reported by the push to main.
        if: ${{ !cancelled() && runner.os == 'Linux' && !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
          format: lcov
          fail-on-error: false
          # Public repositories do not need a Coveralls token: the action's
          # `github-token` input is forwarded to the reporter as
          # COVERALLS_REPO_TOKEN, so the GitHub token verifies the repository
          # at Coveralls. Secrets are not exposed to pull requests from forks,
          # but `GITHUB_TOKEN` always is.
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - run: npm run check:nls
      - run: npm run check:schemas
      - run: npm run check:notices
      - run: npm run build
      - name: E2E smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test

  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install actionlint
        # Pin the version: the README suggests @latest, but a new release could
        # change diagnostics and turn unrelated pull requests red.
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        run: '"$(go env GOPATH)/bin/actionlint" -color'
      - run: npm run lint
      - run: npm run format:check
      - run: npm run lint:css

  site:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run site:build
