name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libasound2t64 libgbm1 xvfb
      - run: npm ci
      - run: npm test
      - name: Coverage gate
        if: runner.os == 'Linux'
        run: npm run test:coverage
      - run: npm run typecheck
      - run: npm run check:nls
      - run: npm run check:schemas
      - run: npm run build
      - name: E2E smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test

  site:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run site:build
